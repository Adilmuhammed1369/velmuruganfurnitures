
<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Admin Panel</title>
	<style>
		body{margin:0;font-family:Poppins,sans-serif;background:#f3f4f6}
		.header{height:64px;background:linear-gradient(90deg,#f59e0b,#ef4444);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
		.container{width:95%;max-width:1100px;margin:20px auto;display:flex;gap:18px}
		.panel{background:#fff;padding:14px;border-radius:8px;border:1px solid #e6e6e6}
		#ordersList .product{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;border-bottom:1px solid #f3f3f3}
		#notifications div{padding:8px;border-bottom:1px solid #eee}
		img.thumb{width:64px;height:64px;object-fit:cover;border-radius:6px}
		button{cursor:pointer}
	</style>
</head>
<body>
	<div class="header">Admin Panel - Velmurugan Furnitures</div>
	<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#fff;border-bottom:1px solid #eee">
		<div style="font-weight:700">Admin Panel - Velmurugan Furnitures</div>
		<div style="display:flex;align-items:center;gap:12px">
			<button id="addProductBtn" style="background:#10b981;color:#fff;padding:8px 12px;border-radius:8px;border:none;cursor:pointer">Add Product</button>
			<div style="position:relative">
				<button id="notifBtn" style="background:#fff;border:1px solid #ddd;padding:8px;border-radius:50%">🔔</button>
				<div id="notifBadge" style="display:none;position:absolute;right:0;top:-6px;background:#ef4444;color:#fff;border-radius:50%;width:18px;height:18px;line-height:18px;text-align:center;font-size:12px">0</div>
			</div>
		</div>
	</div>
	<div class="container">
		<div style="flex:1;min-width:320px;display:flex;flex-direction:column;gap:12px;height:calc(100vh - 160px);overflow:hidden;padding-right:8px">
			<div class="panel" style="flex:0 0 48%;overflow:auto;padding:12px">
				<h3 style="margin:0 0 8px">Products</h3>
				<div id="productsList">Loading products...</div>
				<!-- Notifications container (used by admin scripts) -->
				<div id="notifications" style="display:none;margin-top:8px"></div>
			</div>
			<div id="leftHint" style="margin:6px 0 0 0;color:#6b7280">Select an order to view details</div>
			<div class="panel" style="flex:1 1 52%;overflow:auto;padding:12px;margin-top:0">
				<h3 style="margin:0 0 8px">Orders (grouped by user)</h3>
				<div id="ordersList">Loading orders...</div>
			</div>
		</div>
		<div style="flex:1;min-width:320px;display:flex;flex-direction:column;gap:12px">
			<div class="panel" style="flex:1;overflow:auto;padding:12px">
				<h3 style="margin:0 0 8px">Order Details</h3>
				<div id="orderDetail"></div>
			</div>
		</div>
	</div>
	<script>
	// Admin: add product modal
	function openAddProduct(){
		const html = `
			<div id="addProductModal" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.4);z-index:9999">
				<div style="background:#fff;padding:16px;border-radius:8px;min-width:360px;max-width:640px">
					<h3>Add Product</h3>
					<div style="display:flex;gap:12px">
						<div style="flex:1;display:flex;flex-direction:column;gap:8px">
							<input id="pname" placeholder="Name">
							<input id="pprice" placeholder="Price">
							<textarea id="pdesc" placeholder="Description"></textarea>
							<label style="font-size:13px;color:#374151">Product image (choose from device)</label>
							<input id="pimgfile" type="file" accept="image/*">
							<div id="pimgPreview" style="width:160px;height:120px;border:1px dashed #e5e7eb;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#9ca3af">Preview</div>
							<div style="text-align:right;margin-top:8px">
								<button id="addPCancel">Cancel</button>
								<button id="addPSave" style="background:#10b981;color:#fff;padding:8px;border-radius:6px;border:none">Save</button>
							</div>
						</div>
						<div style="width:220px;flex-shrink:0">
							<div style="font-size:13px;color:#6b7280">Image preview</div>
							<img id="pimgPreviewImg" src="" style="width:100%;height:160px;object-fit:cover;border-radius:8px;display:none;border:1px solid #eee">
						</div>
					</div>
				</div>
			</div>`;
		const wrapper = document.createElement('div'); wrapper.innerHTML = html; document.body.appendChild(wrapper);
		document.getElementById('addPCancel').addEventListener('click', ()=>{ document.getElementById('addProductModal').remove(); });
		const fileInput = document.getElementById('pimgfile');
		const previewImg = document.getElementById('pimgPreviewImg');
		const previewBox = document.getElementById('pimgPreview');
		fileInput.addEventListener('change', function(){ const f = this.files[0]; if(!f) { previewImg.style.display='none'; previewBox.style.display='flex'; return; } // limit file size client-side
			if(f.size > 3 * 1024 * 1024){ alert('Image too large. Please select an image smaller than 3MB.'); this.value = ''; previewImg.style.display='none'; previewBox.style.display='flex'; return; }
			const reader = new FileReader(); reader.onload = function(e){ previewImg.src = e.target.result; previewImg.style.display='block'; previewBox.style.display='none'; }; reader.readAsDataURL(f); });
		document.getElementById('addPSave').addEventListener('click', async ()=>{
			const name = document.getElementById('pname').value;
			const price = document.getElementById('pprice').value;
			const desc = document.getElementById('pdesc').value;
			let imgData = '';
			const f = document.getElementById('pimgfile').files[0];
			// validation: focus missing fields to allow quick fix
			if(!name){ alert('Name is required'); document.getElementById('pname').focus(); return; }
			if(!price){ alert('Price is required'); document.getElementById('pprice').focus(); return; }
			if(f){ imgData = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload = e=>res(e.target.result); r.onerror=err=>rej(err); r.readAsDataURL(f); }); }
			try{
				const body = { name, price, img: imgData || '', description: desc };
				const res = await fetch('/api/products', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
				if(!res.ok){ const txt = await res.text(); alert('Unable to add product: ' + (txt||res.status)); return; }
				const p = await res.json();
				alert('Product added'); document.getElementById('addProductModal').remove();
				try{ if(typeof loadProducts === 'function') loadProducts(); }catch(e){}
			}catch(e){ alert('Unable to add product'); }
		});
	}

	document.getElementById('addProductBtn').addEventListener('click', openAddProduct);

	// notifications badge and panel toggle
	let notificationsData = [];
	const notifBtn = document.getElementById('notifBtn');
	const notifBadge = document.getElementById('notifBadge');
	// helper: refresh badge only
async function refreshNotifBadge(){
  try{
    const res = await fetch('/api/admin/notifications');
    const nots = await res.json();
    const unread = (nots||[]).filter(n=>!n.read).length;
    if(unread>0){ notifBadge.style.display='block'; notifBadge.innerText = unread; } else notifBadge.style.display='none';
  }catch(e){ console.error('badge refresh error', e); }
}

	notifBtn.addEventListener('click', async ()=>{
		// show notifications in the right-hand detail panel and mark all read
		try{ await fetch('/api/admin/notifications/mark-all-read', { method: 'POST' }); }catch(e){ console.error(e); }
		try{
			const res = await fetch('/api/admin/notifications');
			const nots = await res.json();
			const detailEl = document.getElementById('orderDetail');
			if(!nots || nots.length===0){ detailEl.innerHTML = '<div>No notifications</div>'; refreshNotifBadge(); return; }
			let html = '<h3 style="margin-top:0">Notifications</h3>';
			for(const n of nots){ html += `<div style="padding:8px;border-bottom:1px solid #eee"><small>${new Date(n.createdAt).toLocaleString()}</small><div style="margin-top:6px">${n.message || ''}</div></div>`; }
			detailEl.innerHTML = html; refreshNotifBadge();
		}catch(e){ console.error(e); }
	});

// poll unread count every 8 seconds to reflect new notifications on bell
setInterval(refreshNotifBadge, 8000);
// initial badge load
refreshNotifBadge();
// poll products regularly so admin sees updates near-instant
setInterval(()=>{ try{ if(typeof loadProducts==='function') loadProducts(); }catch(e){} }, 3000);

	// products listing and edit/delete
	async function loadProducts(){
		const el = document.getElementById('productsList');
		try{
			const res = await fetch('/api/products');
			const prods = await res.json();
			if(!prods || prods.length===0){ el.innerHTML = '<div>No products</div>'; return; }
			let html = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px">';
			prods.forEach(p=>{
				html += `<div style="border:1px solid #eee;padding:8px;border-radius:8px;background:#fff"><img src="${p.img||p.image||''}" style="width:100%;height:140px;object-fit:cover;border-radius:6px"><div style="font-weight:700;margin-top:8px">${p.name}</div><div style="color:#6b7280">₹ ${p.price}</div><div style="margin-top:8px;display:flex;gap:8px"><button class=\"editProd\" data-id=\"${p._id}\">Edit</button><button class=\"delProd\" data-id=\"${p._id}\">Delete</button></div></div>`;
			});
			html += '</div>';
			el.innerHTML = html;
			// wire
			setTimeout(()=>{ document.querySelectorAll('.editProd').forEach(b=>b.addEventListener('click', async function(){ const id=this.dataset.id; const res = await fetch('/api/products/'+id); const p = await res.json(); openEditProduct(p); })); document.querySelectorAll('.delProd').forEach(b=>b.addEventListener('click', async function(){ if(!confirm('Delete product?')) return; const id=this.dataset.id; await fetch('/api/products/'+id,{ method:'DELETE' }); loadProducts(); })); },50);
		}catch(e){ el.innerHTML = '<div>Unable to load products</div>'; }
	}

	function openEditProduct(p){
		const html = `
			<div id="editProductModal" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.4);z-index:9999">
				<div style="background:#fff;padding:16px;border-radius:8px;min-width:360px;max-width:640px">
					<h3>Edit Product</h3>
					<div style="display:flex;gap:12px">
						<div style="flex:1;display:flex;flex-direction:column;gap:8px">
							<input id="epname" placeholder="Name" value="${p.name}">
							<input id="epprice" placeholder="Price" value="${p.price}">
							<textarea id="epdesc" placeholder="Description">${p.description||''}</textarea>
							<label style="font-size:13px;color:#374151">Replace image (optional)</label>
							<input id="epimgfile" type="file" accept="image/*">
							<div id="epimgPreview" style="width:160px;height:120px;border:1px dashed #e5e7eb;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#9ca3af">Preview</div>
							<div style="text-align:right;margin-top:8px">
								<button id="editPCancel">Cancel</button>
								<button id="editPSave" style="background:#10b981;color:#fff;padding:8px;border-radius:6px;border:none">Save</button>
							</div>
						</div>
						<div style="width:220px;flex-shrink:0">
							<div style="font-size:13px;color:#6b7280">Image preview</div>
							<img id="epimgPreviewImg" src="${p.img||p.image||''}" style="width:100%;height:160px;object-fit:cover;border-radius:8px;display:block;border:1px solid #eee">
						</div>
					</div>
				</div>
			</div>`;
		const wrapper = document.createElement('div'); wrapper.innerHTML = html; document.body.appendChild(wrapper);
		document.getElementById('editPCancel').addEventListener('click', ()=>{ document.getElementById('editProductModal').remove(); });
		const fileInput = document.getElementById('epimgfile'); const previewImg = document.getElementById('epimgPreviewImg'); const previewBox = document.getElementById('epimgPreview');
		fileInput.addEventListener('change', function(){ const f = this.files[0]; if(!f) { previewImg.style.display='block'; previewBox.style.display='flex'; return; } if(f.size > 3*1024*1024){ alert('Image too large. Please select <3MB.'); this.value=''; return; } const reader = new FileReader(); reader.onload = e=>{ previewImg.src = e.target.result; previewImg.style.display='block'; previewBox.style.display='none'; }; reader.readAsDataURL(f); });
		document.getElementById('editPSave').addEventListener('click', async ()=>{
			const name = document.getElementById('epname').value; const price=document.getElementById('epprice').value; const desc=document.getElementById('epdesc').value; const f = document.getElementById('epimgfile').files[0]; if(!name||!price) return alert('Name and price required'); let imgData=''; if(f) imgData = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=rej; r.readAsDataURL(f); });
			try{ const body = { name, price, description: desc }; if(imgData) body.img = imgData; const res = await fetch('/api/products/'+p._id, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) }); if(!res.ok){ alert('Update failed'); return; } alert('Updated'); document.getElementById('editProductModal').remove(); loadProducts(); }catch(e){ alert('Update failed'); }
		});
	}

	async function openRefundCheckout({ orderId, itemIndex = null, amount, label, successCallback }) {
		const endpoint = itemIndex === null ? '/api/orders/' + orderId + '/refund-initiate' : '/api/orders/' + orderId + '/items/' + itemIndex + '/refund-initiate';
		try {
			const res = await fetch(endpoint, { method: 'POST' });
			const data = await res.json();
			if (!res.ok) {
				alert('Refund failed: ' + (data.error || ''));
				return;
			}

			const options = {
				key: data.key_id,
				amount: Math.round((Number(amount) || Number(data.amount) || 0) * 100),
				currency: 'INR',
				name: 'Velmurugan Furnitures',
				description: label || 'Refund',
				order_id: data.razorpayOrder && data.razorpayOrder.id,
				handler: async function(response) {
					try {
						const refundEndpoint = itemIndex === null ? '/api/orders/' + orderId + '/cancel' : '/api/orders/' + orderId + '/items/' + itemIndex + '/refund';
						const refundRes = await fetch(refundEndpoint, {
							method: 'POST',
							headers: { 'Content-Type': 'application/json' },
							body: JSON.stringify({
								razorpay_payment_id: response.razorpay_payment_id,
								razorpay_order_id: response.razorpay_order_id,
								razorpay_signature: response.razorpay_signature
							})
						});
						const refundData = await refundRes.json();
						if (!refundRes.ok) {
							alert('Refund failed: ' + (refundData.error || ''));
							return;
						}
						alert('Refund processed successfully');
						if (typeof successCallback === 'function') successCallback(refundData);
						loadAdmin();
					} catch (e) {
						alert('Refund failed');
					}
				},
				prefill: { name: 'Customer', email: '', contact: '' },
				theme: { color: '#ef4444' }
			};

			if (typeof Razorpay === 'undefined') {
				const script = document.createElement('script');
				script.src = 'https://checkout.razorpay.com/v1/checkout.js';
				script.onload = function(){ const rzp = new Razorpay(options); rzp.open(); };
				document.body.appendChild(script);
			} else {
				const rzp = new Razorpay(options); rzp.open();
			}
		} catch (e) {
			alert('Refund failed');
		}
	}

	async function loadAdmin(){
		const ordersEl = document.getElementById('ordersList');
		const notEl = document.getElementById('notifications');
		const detailEl = document.getElementById('orderDetail');

		// Show order details with per-item updates and admin update UI
		function showOrderDetail(o){
			const userName = o.userId && (o.userId.name || o.userId.username) ? (o.userId.name || o.userId.username) : 'Guest';
			let html = '';
			html += '<div><b>Order ID:</b> ' + o._id + '</div>';
			html += '<div><b>User:</b> ' + userName + '</div>';
			if(o.userId && o.userId.refundAccount){
				const ra = o.userId.refundAccount;
				const raText = ra.upi ? ('UPI: ' + ra.upi) : (ra.bankAccount ? ('Bank: ' + ra.bankAccount + ' (IFSC: ' + (ra.ifsc||'') + ')') : '');
				html += '<div style="margin-top:6px"><b>Refund account:</b> ' + raText + '</div>';
			}
			html += '<div><b>Phone:</b> ' + (o.customerPhone || (o.userId? o.userId.phone : '')) + '</div>';
			html += '<div><b>Address:</b> ' + (o.customerAddress || (o.userId? o.userId.address : '')) + ' - ' + (o.customerPincode || '') + '</div>';
			html += '<div><b>Payment method:</b> ' + (o.paymentMethod||'') + '</div>';
			html += '<div><b>Amount:</b> ₹ ' + (o.amount||'') + '</div>';
			html += '<div style="margin-top:8px"><b>Items:</b></div>';
			(o.items||[]).forEach((it, idx)=>{
				html += `<div style="border:1px solid #f3f3f3;padding:12px;border-radius:8px;margin-top:12px;display:flex;gap:18px;align-items:flex-start">
					<div style="flex:0 0 320px">
						<img src="${it.img || it.image || './assets/images/products/1.jpg'}" style="width:100%;height:auto;border-radius:8px;object-fit:cover;border:1px solid #eee">
					</div>
					<div style="flex:1">
						<div style="font-size:18px;font-weight:700">${it.name}</div>
						<div style="margin:6px 0;color:#374151">${it.description || ''}</div>
						<div style="font-weight:600;color:#064e3b;margin-top:8px">Price: ${it.price}</div>
						<div style="margin-top:8px;color:#6b7280">Expected delivery: ${ new Date(new Date(o.createdAt).getTime() + 7*24*60*60*1000).toLocaleDateString() }</div>
						<div style="margin-top:8px">${ it.canceled ? '<span style="color:#ef4444;font-weight:600">Item cancelled</span>' : '' } ${ it.refunded ? '<span style="color:#10b981;font-weight:600;margin-left:8px">Refunded</span>' : '' }</div>
						<div style="margin-top:8px">${ (o.paymentMethod==='online' && o.paymentStatus==='paid' && it.canceled && !it.refunded) ? `<button class=\"itemRefundBtn\" data-order=\"${o._id}\" data-index=\"${idx}\" style=\"background:#ef4444;color:#fff;border:none;padding:8px 10px;border-radius:6px;cursor:pointer\">Refund item</button>` : '' }</div>
						<div style="margin-top:12px"><b>Updates:</b></div>
						<div id="updates-${o._id}-${idx}">${ (it.updates||[]).map(u=>`<div style="font-size:13px;color:#374151;margin-top:6px"><small>${new Date(u.createdAt).toLocaleString()}</small><div>${u.text}</div></div>`).join('') }</div>
						<div style="margin-top:10px"><textarea id="upd-${o._id}-${idx}" placeholder="Write update for user" style="width:100%;height:96px;padding:8px;border-radius:6px;border:1px solid #e5e7eb"></textarea>
						<div style="text-align:right;margin-top:6px"><button data-order="${o._id}" data-index="${idx}" class="postUpdateBtn" style="background:#3b82f6;color:#fff;padding:8px 10px;border-radius:6px;border:none">Post update</button></div></div>
					</div>
				</div>`;
			});
			detailEl.innerHTML = html;
			// wire post buttons
			document.querySelectorAll('.postUpdateBtn').forEach(btn=>{
				btn.addEventListener('click', async function(){
					const orderId = this.dataset.order; const index = this.dataset.index; const ta = document.getElementById('upd-'+orderId+'-'+index); const text = ta.value.trim(); if(!text) return alert('Enter update');
					try{
						const res = await fetch('/api/admin/orders/' + orderId + '/items/' + index + '/update', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ text }) });
						const j = await res.json();
						if(j.ok){ alert('Update posted'); loadAdmin(); showOrderDetail(j.order); }
					}catch(e){ alert('Unable to post update'); }
				});
			});
			// wire item refund buttons (if present)
			document.querySelectorAll('.itemRefundBtn').forEach(b=>{ b.addEventListener('click', async function(){
				const orderId=this.dataset.order; const idx=this.dataset.index;
				const itemAmount = Number((this.closest('[data-order]') || {}).dataset?.amount || 0);
				if(!confirm('Refund this item?')) return;
				const order = (window.__adminOrders || []).find(o => String(o._id) === String(orderId));
				const item = order && order.items ? order.items[Number(idx)] : null;
				const amount = item ? (Number(item.price) || 0) * (item.quantity || 1) : 0;
				openRefundCheckout({
					orderId,
					itemIndex: idx,
					amount,
					label: item ? 'Refund for ' + item.name : 'Refund item',
					successCallback: function(data){ if (data && data.order) { showOrderDetail(data.order); } }
				});
			}); });
		}

		function showNotificationDetail(notId, order, notifEl){
			const detailEl = document.getElementById('orderDetail');
			if(order){
				// show order full details similar to showOrderDetail but include notification message
				let html = `<div><b>Notification</b> - ${notId}</div>`;
				html += `<div style="margin-top:8px"><b>Order ID:</b> ${order._id}</div>`;
				html += `<div><b>User:</b> ${order.userId? (order.userId.name||order.userId.email): 'Guest'}</div>`;
				html += `<div style="margin-top:8px"><b>Notification message:</b> ${notifEl ? (notifEl.querySelector('div').innerText || '') : ''}</div>`;
				(order.items||[]).forEach((it, idx)=>{
					const imgSrc = it.img || it.image || './assets/images/products/1.jpg';
					html += `<div style="display:flex;gap:12px;align-items:flex-start;margin-top:10px"><img src="${imgSrc}" width="140"><div><div style="font-weight:700">${it.name}</div><div style="margin-top:6px">${it.price}</div><div style="margin-top:8px;color:#6b7280">Expected delivery: ${ new Date(new Date(order.createdAt).getTime() + 7*24*60*60*1000).toLocaleDateString() }</div></div></div>`;
				});
				detailEl.innerHTML = html;
			} else {
				detailEl.innerHTML = `<div><b>Notification</b> - ${notId}</div><div style="margin-top:8px">No order data available for this notification.</div>`;
			}
		}
		try{
			const [ordersRes, prodsRes, notRes] = await Promise.all([fetch('/api/admin/orders'), fetch('/api/products'), fetch('/api/admin/notifications')]);
			const orders = await ordersRes.json();
			window.__adminOrders = orders || [];
			const prods = await prodsRes.json();
			const nots = await notRes.json();
			notificationsData = nots || [];
			// badge
			const unread = notificationsData.filter(n=>!n.read).length;
			if(unread>0){ notifBadge.style.display='block'; notifBadge.innerText = unread; } else notifBadge.style.display='none';
			// render products
			try{ loadProducts(); }catch(e){}

			if(!orders || orders.length===0){ ordersEl.innerHTML = '<div>No orders</div>'; return; }
			// group by user
			const usersMap = {};
			orders.forEach(o=>{
				const uid = o.userId? (o.userId._id || o.userId) : 'guest_'+(o._id);
				if(!usersMap[uid]) usersMap[uid] = { user: o.userId || { name: 'Guest' }, orders: [] };
				usersMap[uid].orders.push(o);
			});

			ordersEl.innerHTML = '';
			Object.keys(usersMap).forEach(uid=>{
				const group = usersMap[uid];
				const card = document.createElement('div');
				card.style.border='1px solid #eee'; card.style.padding='10px'; card.style.borderRadius='8px'; card.style.marginBottom='8px';
				const userName = group.user.name || group.user.username || 'User';
				card.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><div><b>${userName}</b><div style="font-size:12px;color:#666">${group.orders.length} orders</div></div></div><div class="userOrders" style="margin-top:8px;display:none"></div>`;
				ordersEl.appendChild(card);
				const expandBtn = card.querySelector('.expandUser');
				const userOrdersEl = card.querySelector('.userOrders');
				// when clicking the user card, toggle orders list
				card.addEventListener('click', ()=>{
					if(userOrdersEl.style.display==='none'){
						userOrdersEl.style.display='block'; userOrdersEl.innerHTML='';
						group.orders.forEach(o=>{
												const oDiv = document.createElement('div');
												oDiv.style.borderTop='1px solid #f3f3f3'; oDiv.style.paddingTop='8px'; oDiv.style.marginTop='8px';
												oDiv.style.cursor = 'pointer';
												// build items HTML without nested template backticks to avoid syntax errors
												const itemsHtml = (o.items||[]).map(function(it, idx){
														const imgSrc = it.img || it.image || './assets/images/products/1.jpg';
														const refundBtn = (o.paymentStatus==='paid' && !o.canceled) ? ('<button class="refundBtn" data-id="'+o._id+'" style="background:#ef4444;color:#fff;border:none;padding:6px 8px;border-radius:6px;cursor:pointer">Refund</button>') : (o.canceled? '<span style="color:#ef4444">Cancelled</span>' : '');
														return '<div style="display:flex;gap:8px;align-items:center;margin-top:6px">'
															+ '<img src="'+imgSrc+'" width="64">'
															+ '<div><div><b>' + (it.name||'') + '</b></div><div>' + (it.price||'') + '</div></div>'
															+ '<div style="margin-left:auto;display:flex;gap:8px;align-items:center">' + refundBtn + '</div>'
															+ '</div>';
												}).join('');
												oDiv.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center">'
													+ '<div><b>Order ' + o._id + '</b><div style="font-size:12px;color:#666">' + new Date(o.createdAt).toLocaleString() + '</div></div>'
													+ '<div><span style="padding:6px 8px;border-radius:6px;background:' + (o.canceled? '#ef4444' : (o.paymentStatus==='paid' ? '#10b981' : (o.paymentStatus==='pending' ? '#f59e0b':'#9ca3af'))) + ';color:#fff">' + (o.canceled? 'Cancelled': (o.paymentStatus==='paid' ? 'Paid' : (o.paymentStatus==='pending' ? 'Pending':''+o.paymentStatus))) + '</span></div>'
													+ '</div>'
													+ '<div style="margin-top:8px">' + itemsHtml + '</div>';
												userOrdersEl.appendChild(oDiv);
							oDiv.addEventListener('click', (ev)=>{ ev.stopPropagation(); showOrderDetail(o); });
						});
					} else { userOrdersEl.style.display='none'; }
				});
			});

			// attach refund handlers
			document.querySelectorAll('.refundBtn').forEach(b=>{ b.addEventListener('click', function(){ const id=this.dataset.id; const order = (window.__adminOrders || []).find(o => String(o._id) === String(id)); const amount = order ? (Number(order.amount) || 0) : 0; if(!confirm('Refund and cancel this order?')) return; openRefundCheckout({ orderId: id, amount, label: 'Refund order', successCallback: function(){ loadAdmin(); } }); }); });

		}catch(e){ console.error(e); if(ordersEl) ordersEl.innerHTML = '<div>Unable to load admin data</div>'; if(notEl) notEl.innerHTML = '<div>Unable to load notifications</div>'; }
	}

	loadAdmin();
	</script>
</body>
</html>
